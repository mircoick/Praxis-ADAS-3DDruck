# ==============================================================================
# KLIPPERSCREEN CONFIGURATION - STRUCTURED MENU TEMPLATE
# ==============================================================================

[main]
language: de
show_cursor: True
default_printer: MainsailPrinter
theme: material-light

# Display & Energieoptionen (Hochkant 1920x1200)
screen_blanking: 300
screen_blanking_printing: 0
use_dpms: False

# ==============================================================================
# STANDARD-PANELS & MENÜS AUSBLENDEN / UMSTRUKTURIEREN
# ==============================================================================
[menu __main limits]
name: Limits
enable: False

[menu __main network]
name: Network
enable: False


# ==============================================================================
# DRUCKER- & BEWEGUNGSEINSTELLUNGEN
# ==============================================================================

[printer MainsailPrinter]
moonraker_host: 127.0.0.1
moonraker_port: 7125

move_distances: 0.1, 0.5, 1, 5, 10, 25, 50, 100
extrude_distances: 1, 5, 10, 25, 50, 100
extrude_speeds: 1, 2, 5, 10, 15


# ==============================================================================
# TEMPERATUR PRESETS (BEIDE HOTENDS + BETT)
# ==============================================================================

[preheat PLA]
bed: 60
extruder: 200
extruder1: 200

[preheat PETG]
bed: 80
extruder: 240
extruder1: 240

[preheat ABS]
bed: 100
extruder: 250
extruder1: 250

[preheat TPU]
bed: 50
extruder: 220
extruder1: 220

[preheat COOLDOWN]
bed: 0
extruder: 0
extruder1: 0


# ==============================================================================
# UNTERMENÜ 1: WARTUNG & BEWEGUNG (`__main wartung`)
# ==============================================================================

# Ordner-Eintrag im Hauptmenü
[menu __main wartung]
name: Wartung & Achsen
icon: move

# Inhalt des Untermenüs:
[menu __main wartung home]
name: Referenzfahrt (Home All)
icon: home
method: printer.gcode.script
params: {"script": "G28"}

[menu __main wartung cooldown]
name: Abkühlen (Alle Heizer)
icon: cooling
method: printer.gcode.script
params: {"script": "M104 S0\nM104 T1 S0\nM140 S0"}

[menu __main wartung tool_t0]
name: Aktivator: Extruder 0 (Links)
icon: extrude
method: printer.gcode.script
params: {"script": "T0"}

[menu __main wartung tool_t1]
name: Aktivator: Extruder 1 (Rechts)
icon: extrude
method: printer.gcode.script
params: {"script": "T1"}


# ==============================================================================
# UNTERMENÜ 2: FILAMENT STEUERUNG (`__main filament_menu`)
# ==============================================================================

# Ordner-Eintrag im Hauptmenü
[menu __main filament_menu]
name: Filament Handhabung
icon: change-filament

# Extruder 0 (Links)
[menu __main filament_menu load_t0]
name: Laden Extruder 0 (Links 220°C)
icon: extrude
method: printer.gcode.script
params: {"script": "T0\nM109 S220\nG91\nG1 E50 F300\nG90"}

[menu __main filament_menu unload_t0]
name: Entladen Extruder 0 (Links 220°C)
icon: retract
method: printer.gcode.script
params: {"script": "T0\nM109 S220\nG91\nG1 E-50 F1000\nG90"}

# Extruder 1 (Rechts)
[menu __main filament_menu load_t1]
name: Laden Extruder 1 (Rechts 220°C)
icon: extrude
method: printer.gcode.script
params: {"script": "T1\nM109 T1 S220\nG91\nG1 E50 F300\nG90"}

[menu __main filament_menu unload_t1]
name: Entladen Extruder 1 (Rechts 220°C)
icon: retract
method: printer.gcode.script
params: {"script": "T1\nM109 T1 S220\nG91\nG1 E-50 F1000\nG90"}


# ==============================================================================
# UNTERMENÜ 3: HARDWARE & VAKUUM (`__main hardware_menu`)
# ==============================================================================

[menu __main hardware_menu]
name: Hardware & Gehäuse
icon: fan

[menu __main hardware_menu tuer_auf]
name: Tür Öffnen
icon: unlock
method: printer.gcode.script
params: {"script": "Tuer_oeffnen"}

[menu __main hardware_menu gehaeuse_status]
name: Gehäuse Status Prüfen
icon: info
method: printer.gcode.script
params: {"script": "GEHAEUSE_STATUS"}

[menu __main hardware_menu vakuum_hinten_on]
name: Vakuumpumpe Hinten AN
icon: fan
method: printer.gcode.script
params: {"script": "SET_FAN_SPEED FAN=Vakuum_Pumpe_Hinten SPEED=1.0"}

[menu __main hardware_menu vakuum_hinten_off]
name: Vakuumpumpe Hinten AUS
icon: fan
method: printer.gcode.script
params: {"script": "SET_FAN_SPEED FAN=Vakuum_Pumpe_Hinten SPEED=0.0"}

[menu __main hardware_menu vakuum_ext_on]
name: Vakuumpumpe Extruder AN
icon: fan
method: printer.gcode.script
params: {"script": "SET_FAN_SPEED FAN=Vakuum_Pumpe_Extruder SPEED=1.0"}

[menu __main hardware_menu vakuum_ext_off]
name: Vakuumpumpe Extruder AUS
icon: fan
method: printer.gcode.script
params: {"script": "SET_FAN_SPEED FAN=Vakuum_Pumpe_Extruder SPEED=0.0"}


# ==============================================================================
# UNTERMENÜ 4: SYSTEM & RESTART (`__main system_menu`)
# ==============================================================================

# Ordner-Eintrag im Hauptmenü
[menu __main system_menu]
name: System & Neustart
icon: settings

# Inhalt des Untermenüs:
[menu __main system_menu fw_restart]
name: Firmware Restart
icon: restart
method: printer.gcode.script
params: {"script": "FIRMWARE_RESTART"}

[menu __main system_menu restart_klipper]
name: Klipper Host Restart
icon: restart
method: printer.gcode.script
params: {"script": "RESTART"}


