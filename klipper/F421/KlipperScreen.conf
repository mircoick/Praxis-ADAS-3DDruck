# ==============================================================================
# KLIPPERSCREEN CONFIGURATION - STRUCTURED MENU TEMPLATE
# ==============================================================================

[main]
language: de
show_cursor: True
default_printer: MainsailPrinter
theme: material-light

# Display & Energieoptionen
screen_blanking: 300
screen_blanking_printing: 0
use_dpms: False

# ==============================================================================
# STANDARD-PANELS & MENÜS AUSBLENDEN / UMSTRUKTURIEREN
# ==============================================================================
[menu __main limits]
name: Limits
enable: False

[menu __main network]
name: Network
enable: False


# ==============================================================================
# DRUCKER- & BEWEGUNGSEINSTELLUNGEN
# ==============================================================================

[printer MainsailPrinter]
moonraker_host: 127.0.0.1
moonraker_port: 7125

move_distances: 0.1, 0.5, 1, 5, 10, 25, 50, 100
extrude_distances: 1, 5, 10, 25, 50, 100
extrude_speeds: 1, 2, 5, 10, 15


# ==============================================================================
# TEMPERATUR PRESETS
# ==============================================================================

[preheat PLA]
bed: 60
extruder: 200

[preheat PETG]
bed: 80
extruder: 240

[preheat ABS]
bed: 100
extruder: 250

[preheat TPU]
bed: 50
extruder: 220

[preheat COOLDOWN]
bed: 0
extruder: 0


# ==============================================================================
# UNTERMENÜ 1: WARTUNG & BEWEGUNG (`__main wartung`)
# ==============================================================================

# Ordner-Eintrag im Hauptmenü
[menu __main wartung]
name: Wartung & Achsen
icon: move

# Inhalt des Untermenüs:
[menu __main wartung home]
name: Referenzfahrt (Home All)
icon: home
method: printer.gcode.script
params: {"script": "G28"}

[menu __main wartung cooldown]
name: Abkühlen
icon: cooling
method: printer.gcode.script
params: {"script": "M104 S0\nM140 S0"}


# ==============================================================================
# UNTERMENÜ 2: FILAMENT STEUERUNG (`__main filament_menu`)
# ==============================================================================

# Ordner-Eintrag im Hauptmenü
[menu __main filament_menu]
name: Filament Handhabung
icon: change-filament

# Inhalt des Untermenüs:
[menu __main filament_menu m600]
name: Filament Wechseln (M600)
icon: change-filament
method: printer.gcode.script
params: {"script": "M600"}

[menu __main filament_menu load]
name: Filament Laden (Hotend 220°C)
icon: extrude
method: printer.gcode.script
params: {"script": "M109 S220\nG91\nG1 E50 F300\nG90"}

[menu __main filament_menu unload]
name: Filament Entladen (Hotend 220°C)
icon: retract
method: printer.gcode.script
params: {"script": "M109 S220\nG91\nG1 E-50 F1000\nG90"}


# ==============================================================================
# UNTERMENÜ 3: SYSTEM & RESTART (`__main system_menu`)
# ==============================================================================

# Ordner-Eintrag im Hauptmenü
[menu __main system_menu]
name: System & Neustart
icon: settings

# Inhalt des Untermenüs:
[menu __main system_menu fw_restart]
name: Firmware Restart
icon: restart
method: printer.gcode.script
params: {"script": "FIRMWARE_RESTART"}

[menu __main system_menu restart_klipper]
name: Klipper Host Restart
icon: restart
method: printer.gcode.script
params: {"script": "RESTART"}


