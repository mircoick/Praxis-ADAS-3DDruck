[include mainsail.cfg]
[respond]

########################################
# Host-MCU configuration
########################################

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_32002C001551333234383131-if00
serial: /dev/ttyAMA0
restart_method: command

[mcu RP2040]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_50443405B0B0781C-if00
serial: /dev/ttyAMA2
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

########################################
# Stepper-Motor configuration
########################################

[force_move]
enable_force_move: True

# S1
[stepper_x]
step_pin: PB9
dir_pin: !PB8
enable_pin: !PB7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC15
position_endstop: 0
position_max: 200
homing_speed: 50

# S2
[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF0
position_endstop: 0
position_max: 200
homing_speed: 50

# S3
[stepper_z]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PF2
position_endstop: 0
position_max: 500

# S5
