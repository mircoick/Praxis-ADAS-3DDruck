#spi_bus: spi3a
#rtd_nominal_r: 1000
#rtd_reference_r: 4300
#rtd_num_of_wires: 2

########################################
# printer-chamber configuration
########################################

[output_pin Heizbett]
pin: PD12
value: 0
shutdown_value: 0

#[servo servo_motor]
#pin: PG1
#maximum_servo_angle: 180
#minimum_pulse_width: 0.0009
#maximum_pulse_width: 0.0021
#initial_angle: 170

########################################
# TMC2160 configuration
########################################

[tmc5160 stepper_x]
cs_pin: PD3
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
#diag1_pin: PC15
run_current: 0.800
sense_resistor: 0.022
stealthchop_threshold: 999999

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
#diag1_pin: PF0
run_current: 0.800
sense_resistor: 0.022
stealthchop_threshold: 999999

[tmc5160 stepper_z]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
#diag1_pin: PF1
run_current: 0.650
sense_resistor: 0.022
stealthchop_threshold: 999999

