[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A104KTMA-if00-port0

[include mainsail.cfg]

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
[thermistor Custom_10K_3950]
temperature1: 25.0
resistance1: 10000.0
beta: 3950
[gcode_button display_reset]
pin: ^!PG0
press_gcode:
    FIRMWARE_RESTART

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PE5
position_endstop: 0
position_max: 203
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 178
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PD3
position_endstop: 0
position_max: 350
homing_speed: 10


[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_fan hotend_fan]
pin: PB5
heater: extruder
heater_temp: 50
fan_speed: 1.0

[fan_generic gehaeuse_luefter]
pin: PH6

[delayed_gcode gehaeuse_luefter_steuerung]
initial_duration: 2
gcode:
    {% set hotend_temp = printer.extruder.temperature %}
    {% set hotend_target = printer.extruder.target %}
    {% set bed_temp = printer.heater_bed.temperature %}
    {% set bed_target = printer.heater_bed.target %}
    {% set max_temp = 180 %}

    {% if hotend_target == 0 and bed_target == 0 and (hotend_temp > 45 or bed_temp > 40) %}
        {% set speed = 1.0 %}
    {% elif hotend_temp >= 50 %}
        {% set speed = 0.2 + (hotend_temp - 50) * (0.8 / (max_temp-50)) %}
    {% else %}
        {% set speed = 0.0 %}
    {% endif %}

    SET_FAN_SPEED FAN=gehaeuse_luefter SPEED={speed}
    UPDATE_DELAYED_GCODE ID=gehaeuse_luefter_steuerung DURATION=3

[heater_bed]
heater_pin: PH5
sensor_type: Custom_10K_3950
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[display]
lcd_type: hd44780
rs_pin: PH1
e_pin: PH0
d4_pin: PA1
d5_pin: PA3
d6_pin: PA5
d7_pin: PA7
encoder_pins: ^PC4, ^PC6
click_pin: ^!PC2
# encoder_steps_per_detent: 1

[output_pin beeper]
pin: PC0

