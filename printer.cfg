[heater_bed]
heater_pin: PH5
sensor_type: Custom_10K_3950
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[display]
lcd_type: hd44780
rs_pin: PH1
e_pin: PH0
d4_pin: PA1
d5_pin: PA3
d6_pin: PA5
d7_pin: PA7
encoder_pins: ^PC4, ^PC6
click_pin: ^!PC2
# encoder_steps_per_detent: 1

[output_pin beeper]
pin: PC0


[gcode_macro M600]
description: Filament change
gcode: PAUSE X=110 Y=100 Z_MIN=200

[bed_screws]
screw1: 10, 10
screw1_name: vorne links
screw2: 180, 10
screw2_name: vorne rechts
screw3: 180, 175
screw3_name: hinten rechts
screw4: 10, 175
screw4_name: hinten links

[load_cell_probe]
sensor_type: hx711
sclk_pin: host:gpio5
dout_pin: host:gpio6
sample_rate: 10
gain: A-128

x_offset: 0
y_offset: 0
z_offset: 0

speed: 1.0
lift_speed: 5.0

#samples: 3
#samples_result: median
#sample_retract_dist: 2.0
#samples_tolerance: 0.02
#samples_tolerance_retries: 3


[bed_mesh]
horizontal_move_z: 3
mesh_min: 10, 10
mesh_max: 190, 170
probe_count: 5, 5
speed: 50

