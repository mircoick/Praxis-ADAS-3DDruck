[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A104KTMA-if00-port0

[mcu host]
serial: /tmp/klipper_host_mcu

[include mainsail.cfg]

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[thermistor Custom_10K_3950]
temperature1: 25.0
resistance1: 10000.0
beta: 3950

[gcode_button display_reset]
pin: ^!PG0
press_gcode:
    FIRMWARE_RESTART

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PE5
position_endstop: -10
position_min: -10
position_max: 192
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: -2
position_min: -2
position_max: 175
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 1.25
endstop_pin: ^!PD3
position_endstop: -5
position_min: -5
position_max: 48
homing_speed: 10



[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 240

[heater_fan hotend_fan]
pin: PB5
heater: extruder
heater_temp: 50
fan_speed: 1.0

[fan_generic gehaeuse_luefter]
pin: PH6

#[delayed_gcode gehaeuse_luefter_steuerung]
